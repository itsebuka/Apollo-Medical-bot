substance_protocols:
  button_battery:
    emergency: true
    induce_vomiting: false
    npo: true
    honey_protocol:
      eligible_min_age_months: 12
      eligible_max_hours_since_ingestion: 12
      dose_ml: 10
      dose_tsp: 2
      frequency_minutes: 10
      max_doses: 6
      warning: "Honey is CONTRAINDICATED in children under 12 months (infant botulism risk)."
    instructions: "Go to the nearest emergency room immediately. Do NOT induce vomiting. Keep NPO. If child is >=12 months AND ingestion <12h ago: give 10mL (2tsp) honey every 10min (max 6 doses) en route ONLY if available. Do NOT give honey to infants under 12 months."

  paracetamol_overdose:
    emergency: true
    induce_vomiting: false
    treatment: "N-Acetylcysteine (NAC)"
    treatment_window_hours: 8
    instructions: "Go to the nearest emergency room immediately. N-Acetylcysteine (NAC) is most effective within 8 hours of ingestion. Bring the medication container. Do NOT induce vomiting."

  general_ingestion:
    emergency: true
    induce_vomiting: false
    instructions: "Go to the nearest emergency room immediately. Bring the container or substance if safe to do so. Do NOT induce vomiting unless directly instructed by Poison Control or emergency services."

