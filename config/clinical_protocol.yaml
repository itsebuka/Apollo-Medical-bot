# =============================================================================
# Apollo Clinical Protocol Configuration
# =============================================================================
# WARNING: CLINICIAN SIGN-OFF REQUIRED BEFORE PRODUCTION DEPLOYMENT
# Per task spec §7, all clinical values must be reviewed by a licensed clinician
# or clinical advisory board before this backend serves real users.
#
# CI RULE: This file must NOT be modified in the same commit as application
# code unless the commit message contains:
#     CLINICAL-REVIEWED-BY: <clinician name>
# Enforced by .git/hooks/pre-commit.
# =============================================================================

version: "1.0.0"
last_reviewed_by: "AWAITING CLINICIAN SIGN-OFF"
last_reviewed_date: "2026-08-20"
sources:
  - "WHO/UNICEF IMCI Integrated Management of Childhood Illness, 2014"
  - "WHO Pocket Book of Hospital Care for Children, 2nd Ed."
  - "American Academy of Pediatrics Clinical Practice Guidelines"
  - "NCBI Esposito et al. 2020, Button Battery Ingestion"

respiratory_rate_thresholds:
  - band: "neonatal"
    age_min_months: 0
    age_max_months: 2
    fast_breathing_threshold: 60
    label: "<2 months: >=60 breaths/min"
  - band: "young_infant"
    age_min_months: 2
    age_max_months: 12
    fast_breathing_threshold: 50
    label: "2-11 months: >=50 breaths/min"
  - band: "toddler"
    age_min_months: 12
    age_max_months: 60
    fast_breathing_threshold: 40
    label: "1-5 years: >=40 breaths/min"

